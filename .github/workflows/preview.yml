name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        if: github.event.action != 'closed'
        run: npm run build
        env:
          PREVIEW_LABEL: "PR #${{ github.event.number }} preview"

      # Deploys ./dist to gh-pages under /pr-preview/pr-N/, comments the link
      # on the PR, and deletes the folder when the PR is closed.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
